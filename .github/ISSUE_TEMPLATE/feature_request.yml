name: Feature request
description: Propose a check, skill or workflow for Swift/SwiftUI projects.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong today when Claude works on your project? A concrete example is worth more than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should swift-harness do? How would you know it works?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including Claude Code settings or existing tools.
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      options:
        - label: I checked the [roadmap](https://github.com/davidelarocca/mac-dev-plugins/blob/main/ROADMAP.md) and the open issues.
          required: true
