# SwiftLint config generated by swift-harness.
# The design system rules start as warnings. Switch their severity to error
# once the migration of hardcoded values is finished.

excluded:
  - .build
  - "**/.build"
  - DerivedData
  - "**/*.generated.swift"

disabled_rules:
  - trailing_comma # the formatter owns this
  - todo

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - sorted_first_last
  - redundant_nil_coalescing
  - private_swiftui_state
  - weak_delegate

line_length:
  warning: 160
  error: 220
  ignores_comments: true

type_body_length:
  warning: 400
  error: 700

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 80
  error: 150

# Design system enforcement: raw visual values are allowed only inside the
# design system and tests. Adjust the excluded regex to the real path.
custom_rules:
  ds_hardcoded_color:
    name: "Hardcoded color"
    regex: '(\bColor\(\s*(red|hue|white)\s*:|\bNSColor\(\s*(red|calibratedRed|srgbRed|deviceRed|white|calibratedWhite)\s*:|#colorLiteral)'
    message: "Use a semantic color from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  ds_hardcoded_font_size:
    name: "Hardcoded font size"
    regex: '(\.system\(\s*size\s*:|\bNSFont\.(systemFont|boldSystemFont|monospacedSystemFont)\(\s*ofSize\s*:\s*[0-9]|\.custom\([^)]*size\s*:\s*[0-9])'
    message: "Use a Typography token from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  ds_hardcoded_padding:
    name: "Hardcoded padding"
    regex: '\.padding\(\s*(\.[A-Za-z]+\s*,\s*)?-?[0-9]+(\.[0-9]+)?\s*\)'
    message: "Use a Spacing token from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  ds_hardcoded_spacing:
    name: "Hardcoded stack spacing"
    regex: '\bspacing\s*:\s*[1-9][0-9]*(\.[0-9]+)?\b'
    message: "Use a Spacing token from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  ds_hardcoded_radius:
    name: "Hardcoded corner radius"
    regex: '(\bcornerRadius\s*:\s*[0-9]|\.cornerRadius\(\s*[0-9])'
    message: "Use a Radius token from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  ds_hardcoded_animation:
    name: "Hardcoded animation timing"
    regex: '\.(easeInOut|easeIn|easeOut|linear|spring|smooth|snappy|bouncy)\(\s*(duration|response)\s*:\s*[0-9]'
    message: "Use a Motion token from the design system."
    severity: warning
    excluded: '{{DS_EXCLUDED_REGEX}}'
    excluded_match_kinds: [comment, doccomment]
  # Reduce Motion (#52): a transition that moves content goes through the design system's
  # Motion.moving(_:reduced:), which fades instead. Applies inside the design system too, where
  # shared components animate. A transition split over several lines is not seen.
  ds_motion_without_reduce:
    name: "Moving transition without Reduce Motion"
    regex: '\.transition\((?![^\n]*Motion\.moving\()[^\n]*(\.move\(|\.slide\b|\.push\(|\.offset\(|\.scale\b)'
    message: "This transition moves content. Wrap it in Motion.moving(_:reduced:) with @ReduceMotion, so Reduce Motion gets a fade."
    severity: warning
    excluded_match_kinds: [comment, doccomment, string]
  # Concurrency escape hatches: each silences Swift's data race checks. A new one needs a
  # reason on the same line, `// concurrency: <why it is safe>`; the SwiftLint baseline keeps
  # the ones already there (swiftlint lint --write-baseline).
  concurrency_unchecked_sendable:
    name: "Unchecked Sendable"
    regex: '@unchecked\s+Sendable(?!(?:[^\n"]|"(?:[^"\\\n]|\\.)*")*//\s*concurrency:\s*\S)'
    message: "@unchecked Sendable turns off data race checking for this type. Prefer an actor, a Mutex, or Sendable stored properties; if it is needed, say why on the same line: // concurrency: <why it is safe>"
    severity: error
    excluded_match_kinds: [comment, doccomment, string]
  concurrency_nonisolated_unsafe:
    name: "nonisolated(unsafe)"
    regex: 'nonisolated\s*\(\s*unsafe\s*\)(?!(?:[^\n"]|"(?:[^"\\\n]|\\.)*")*//\s*concurrency:\s*\S)'
    message: "nonisolated(unsafe) opts this state out of isolation checking. Prefer a let, an actor, a Mutex or @MainActor; if it is needed, say why on the same line: // concurrency: <why it is safe>"
    severity: error
    excluded_match_kinds: [comment, doccomment, string]
  concurrency_preconcurrency:
    name: "@preconcurrency"
    regex: '@preconcurrency\b(?!(?:[^\n"]|"(?:[^"\\\n]|\\.)*")*//\s*concurrency:\s*\S)'
    message: "@preconcurrency hides Sendable and isolation errors from that import or conformance. Prefer updating the dependency or isolating its use; if it is needed, say why on the same line: // concurrency: <why it is safe>"
    severity: error
    excluded_match_kinds: [comment, doccomment, string]
  concurrency_assume_isolated:
    name: "assumeIsolated"
    regex: '\.assumeIsolated\s*[({](?!(?:[^\n"]|"(?:[^"\\\n]|\\.)*")*//\s*concurrency:\s*\S)'
    message: "assumeIsolated crashes at run time if the assumption is wrong. Prefer await or marking the caller with the actor; if it is needed, say why on the same line: // concurrency: <why it is safe>"
    severity: error
    excluded_match_kinds: [comment, doccomment, string]
